<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Meu Pet Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        transition: background-image 1.5s ease-in-out;
      }
      #mainImage {
        transition: opacity 0.25s ease, transform 0.3s ease;
        filter: drop-shadow(0 10px 28px rgba(0,0,0,0.22));
      }
      #mainImage:active { transform: scale(0.97); }

      @keyframes twinkle {
        0%, 100% { opacity: 0.15; transform: scale(1); }
        50%       { opacity: 1;    transform: scale(1.3); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-10px); }
      }
      .star {
        position: fixed;
        border-radius: 50%;
        background: white;
        animation: twinkle 2s infinite;
        pointer-events: none;
        display: none;
        z-index: 0;
      }
      #mainImage { animation: float 3s ease-in-out infinite; }
    </style>
  </head>

  <body
    class="min-h-screen flex flex-col"
    style="
      background-image: url('dia.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    "
  >
    <!-- Estrelas animadas (aparecem à noite) -->
    <div id="stars"></div>

    <!-- Topo: avatar + nome + toggle -->
    <div class="w-full flex items-center justify-between p-4 gap-3 z-10">
      <div class="flex items-center gap-3">
        <!-- Avatar -->
        <div class="avatar">
          <div class="w-14 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2 bg-white/60 shadow">
            <img id="avatarImg" src="normal.png" alt="avatar"/>
          </div>
        </div>
        <!-- Nome -->
        <input
          type="text"
          id="nomeCriatura"
          placeholder="Nome do pet..."
          class="input input-sm input-bordered bg-white/70 backdrop-blur-sm w-36"
          maxlength="20"
        />
      </div>

      <!-- Toggle dia / noite -->
      <label class="flex items-center gap-2 cursor-pointer bg-white/50 backdrop-blur-sm px-3 py-2 rounded-full shadow">
        <span class="text-base">☀️</span>
        <input
          type="checkbox"
          id="toggleNoite"
          class="toggle toggle-sm toggle-primary"
          onchange="alternarModoManual(this.checked)"
        />
        <span class="text-base">🌙</span>
      </label>
    </div>

    <!-- Criatura + status -->
    <div class="flex flex-col items-center flex-1 justify-center w-full px-4 z-10">

      <!-- Barra de fome -->
      <div class="flex items-center gap-2 mb-4 bg-white/60 backdrop-blur-sm px-4 py-2 rounded-full shadow">
        <span class="text-sm font-semibold text-gray-600">🍽️ Fome</span>
        <progress id="barraFome" class="progress progress-warning w-36" value="0" max="100"></progress>
      </div>

      <!-- Imagem principal -->
      <img
        id="mainImage"
        src="normal.png"
        alt="Pet"
        class="w-full max-w-[450px] h-auto"
      />

      <!-- Badge de status -->
      <div class="mt-4">
        <span id="statusBadge" class="badge badge-primary badge-lg font-semibold px-5 py-3 text-base shadow">
          😊 Normal
        </span>
      </div>

      <!-- Botão de comida -->
      <div class="mt-8">
        <img
          id="btnComida"
          src="comidaa.png"
          alt="Alimentar"
          title="Clique para alimentar!"
          class="w-28 h-28 cursor-pointer active:scale-90 transition hover:scale-110 drop-shadow-lg"
          onclick="alimentar()"
        />
        <p class="text-center text-xs text-white/80 mt-1 drop-shadow font-medium">Clique para alimentar</p>
      </div>

    </div>

    <!-- Rodapé -->
    <div class="w-full flex justify-center pb-3 z-10">
      <p class="text-xs text-white/70 drop-shadow">🌿 Cuide bem do seu pet!</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
