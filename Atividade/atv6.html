<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 06 </title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>
    <div class="card">
        <h2>Orçamento de Eventos</h2>
        <label>Pacote:</label>
        <select id="pacote">
            <option value="50">Standard R$ 50,00 - pessoa</option>
            <option value="80">Premium R$ 80,00 - pessoa</option>
            <option value="120">Infinity Deluxe R$ 120,00 - pessoa</option>
        </select>
        <label>QTD de Pessoas:</label>
        <input type="number" id="pessoas" min="1" value="1">
        <button onclick="calcularOrcamento()">Calcular Orçamento</button>
        <div id="resultado" style="display: none;">
            <p>Custo: R$ <span id="custoBruto"></span></p>
            <p>Taxa de Serviço (10%): R$ <span id="taxaServico"></span></p>
            <p>Desconto Fidelidade: R$ <span id="desconto"></span></p>
            <hr>
            <p><strong>Total Final: R$ <span id="totalFinal"></span></strong></p>
        </div>
    </div>
    <script src="script6.js"></script>
</body>
</html>
