<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exc 02 - Conversor </title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="container">
        <h2>Conversor de Temperatura</h2>
        
        <div class="input-group">
            <label>Celsius(°C):</label>
            <input type="number" id="celsius" step="0.1" oninput="converterFahrenheit()">
        </div>

        <div class="input-group">
            <label>Fahrenheit(°F):</label>
            <input type="number" id="fahrenheit" step="0.1" oninput="converterCelsius()">
        </div>
    </div>

    <script src="script2.js"></script>
</body>
</html>
