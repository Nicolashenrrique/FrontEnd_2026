<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 07 </title>
    <link rel="stylesheet" href="style7.css">
</head>
<body>
    <div class="card">
        <h2>Validador de Cartão Infinity</h2>
        <label>Informe o número do Cartão:</label>
        <input type="text" id="numeroCartao" placeholder="Digite o número (13 a 16 dígitos)" maxlength="19">
        <button onclick="analisarCartao()">Analisar Cartão</button>
        <div id="painelInfo" style="display: none;">
            <p><strong>Status:</strong> <span id="statusCartao"></span></p>
            <p><strong>Bandeira:</strong> <span id="bandeiraCartao"></span></p>
            <p><strong>Setor:</strong> <span id="setorCartao"></span></p>
            <p><strong>Banco:</strong> <span id="bancoCartao"></span></p>
        </div>
    </div>
    <script src="script7.js"></script>
</body>
</html>
