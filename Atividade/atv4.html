<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 04 - Simulador Banco</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>
    <div class="container">
        <h2>Simulador Infinity Bank</h2>
        
        <label>Bandeira do Cartão:</label>
        <select id="bandeira">
            <option value="visa">Visa (2%)</option>
            <option value="master">Mastercard (1.85%)</option>
            <option value="elo">Elo (3%)</option>
        </select>

        <label>Valor da Venda (R$):</label>
        <input type="number" id="valorVenda" step="0.01" placeholder="Ex: 1000.00">

        <label>Número de Parcelas:</label>
        <input type="number" id="parcelas" min="1" placeholder="Ex: 12">

        <button onclick="calcularTaxas()">Simular</button>

        <div class="resumo" id="resumoFinal" style="display: none;">
            <p>Taxa da Bandeira: R$ <span id="outBandeira"></span></p>
            <p>Valor dos Juros (0.35% a.m): R$ <span id="outJuros"></span></p>
            <p>Taxa Mensal Fixa (Total): R$ <span id="outFixa"></span></p>
            <hr>
            <p>Valor Total da Compra: R$ <span id="outTotal"></span></p>
            <p>Valor de Cada Parcela: R$ <span id="outParcela"></span></p>
        </div>
    </div>

    <script src="script4.js"></script>
</body>
</html>
